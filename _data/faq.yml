- q: "Who can attend?"
  a: "All high school students in grades 9–12 are welcome, regardless of gender, background, or prior writing experience. Beginners and experienced writers alike are encouraged to join."
- q: "Is the event really free?"
  a: "Yes. Admission, workshop materials, meals and snacks, and event swag are completely free for every registered participant, thanks to our sponsors."
- q: "Do I need a finished draft before the event?"
  a: "Not at all. You can start completely from scratch using our curated prompt sessions — plenty of people do."
- q: "What should I bring?"
  a: "Your preferred writing medium (laptop and charger, or notebooks and pens), a refillable water bottle, and an open imagination."
- q: "Do I have to read at the open mic?"
  a: "No. The reading circle is entirely optional, and plenty of writers come to listen. If you do read, you choose the excerpt and how long it runs."
- q: "Can I use ChatGPT or another AI tool?"
  a: "No. Generative AI is not permitted at Writer's Hook — not for drafting, not for editing, not for getting started. Spellcheck, dictionaries, research, and any assistive technology you rely on are all still fine. The full AI policy is linked in the footer."
- q: "Who owns what I write?"
  a: "You do, always. Submitting to the anthology is optional, and nothing is published, quoted, or posted without your permission."
- q: "What about food allergies or dietary needs?"
  a: "Tell us on the registration form and we will make sure there is something for you."
