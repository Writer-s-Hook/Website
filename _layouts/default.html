<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <!-- Browsers request /favicon.ico at the root on their own, before the tags
       below are parsed, so it has to exist as well as be declared. -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="icon" type="image/png" sizes="64x64" href="{{ '/images/wh-favicon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/images/wh-apple-touch-icon.png' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Moon+Dance&family=Quattrocento:wght@400;700&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap">
  <script>
    // Stamp the stored choice before first paint, so the page never flashes
    // the wrong theme. No stored value means follow the system.
    try { var t = localStorage.getItem('wh-theme');
          if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <noscript>
    <style>
      /* The menu button needs JavaScript to open the nav. Without it, show the
         nav outright and drop the button, so the links stay reachable on small
         screens instead of sitting behind a control that does nothing. */
      @media (max-width: 900px) {
        .site-nav { display: flex; }
        .nav-toggle { display: none; }
      }
    </style>
  </noscript>
</head>
<body class="page {{ page.bodyClass }}">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="wrapper">
    {% include header.html %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html %}
  </div>
  <script src="{{ '/assets/js/scripts.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</body>
</html>
