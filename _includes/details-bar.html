<section class="details" aria-label="Event details">
  <div class="container">
    <dl class="details-grid">
      <div><dt>Date</dt><dd>{{ site.event.date }}<span class="details-sub">{{ site.event.time }}</span></dd></div>
      <div><dt>Location</dt><dd>{{ site.event.venue }}<span class="details-sub">{{ site.event.venue_address }}</span></dd></div>
      <div><dt>Eligibility</dt><dd>All high school students<span class="details-sub">{{ site.event.eligibility }}</span></dd></div>
      <div><dt>Cost</dt><dd>100% free<span class="details-sub">Workshops, meals, snacks, and prizes included</span></dd></div>
    </dl>
  </div>
</section>
